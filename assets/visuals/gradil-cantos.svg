<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="gLine" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#143CFF" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#6E1EE6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#00E1B4" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="gHex" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#143CFF"/>
      <stop offset="1" stop-color="#6E1EE6"/>
    </linearGradient>
    <g id="hexFlat">
      <!-- hexágono deitado (flat-top) -->
      <path d="M22 8 L38 8 L46 22 L38 36 L22 36 L14 22 Z" fill="url(#gHex)" fill-opacity="0.12" stroke="url(#gLine)" stroke-width="0.8"/>
    </g>
  </defs>
  <!-- gradil hex deitado -->
  <use href="#hexFlat" x="0" y="0"/>
  <use href="#hexFlat" x="44" y="0"/>
  <use href="#hexFlat" x="88" y="0"/>
  <use href="#hexFlat" x="22" y="32"/>
  <use href="#hexFlat" x="66" y="32"/>
  <use href="#hexFlat" x="110" y="32"/>
  <use href="#hexFlat" x="0" y="64"/>
  <use href="#hexFlat" x="44" y="64"/>
  <!-- conexões -->
  <path d="M36 22 L58 38" stroke="url(#gLine)" stroke-width="1.2" opacity="0.55"/>
  <path d="M80 22 L102 38" stroke="url(#gLine)" stroke-width="0.8" opacity="0.35"/>
  <path d="M58 54 L90 70" stroke="url(#gLine)" stroke-width="1.5" opacity="0.65"/>
  <path d="M120 30 L180 55 L240 40" stroke="url(#gLine)" stroke-width="1" opacity="0.4"/>
  <path d="M200 80 L280 100 L360 75" stroke="url(#gLine)" stroke-width="1.8" opacity="0.5"/>
  <path d="M300 20 L380 45 L460 30" stroke="url(#gLine)" stroke-width="0.7" opacity="0.3"/>
  <!-- pontos de luz -->
  <circle cx="58" cy="38" r="3" fill="#00E1B4" opacity="0.7"/>
  <circle cx="180" cy="55" r="2.5" fill="#6E1EE6" opacity="0.65"/>
  <circle cx="280" cy="100" r="3.5" fill="#143CFF" opacity="0.75"/>
  <circle cx="360" cy="75" r="2" fill="#00FFFF" opacity="0.55"/>
  <circle cx="102" cy="38" r="2" fill="#C800D2" opacity="0.5"/>
</svg>
